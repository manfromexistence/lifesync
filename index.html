<style>

:root[data-theme="dark"]{--bg:#070a12;--cd:rgba(255,255,255,.06);--tx:#eef2ff;--mu:#94a3c4;--ln:rgba(255,255,255,.1);--ac:#5eead4;--ac2:rgba(94,234,212,.14);--nv:rgba(14,19,36,.86);--g:linear-gradient(135deg,#2dd4bf,#6366f1 65%,#a855f7)}

body{background:radial-gradient(800px 420px at 0 -5%,rgba(99,102,241,.3),transparent 60%),radial-gradient(600px 420px at 100% 5%,rgba(45,212,191,.18),transparent 55%),var(--bg);background-attachment:fixed;padding-bottom:104px}

button.ol,button.sm{background:var(--cd);color:var(--tx);box-shadow:none;border:1px solid var(--ln)}

.rem{--c:#f43f5e}
.ch span{border:1px solid var(--ln)}
.cl{border-radius:12px}

nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border-radius:22px;background:var(--nv);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.35)}

.eng{--c:#84cc16}.hs{--c:#d946ef}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cd,.r,.hero{animation:up .4s both}
.lb::before{margin-right:6px}
.shift .lb::before{content:'💼'}.commute .lb::before{content:'🚌'}.class .lb::before{content:'🎓'}.travel .lb::before{content:'🚶'}.sleep .lb::before{content:'😴'}.meal .lb::before{content:'🍽️'}.gym .lb::before{content:'🏋️'}.study .lb::before{content:'📚'}.care .lb::before{content:'✨'}.plan .lb::before{content:'📝'}.eng .lb::before{content:'🗣️'}.hs .lb::before{content:'🌍'}.rem .lb::before{content:'🔔'}.free .lb::before{content:'☕'}
.mo .lb::before{content:none!important}
.ostudy{--c:#14b8a6}.thesis{--c:#22d3ee}.ostudy .lb::before{content:'🏢'}.thesis .lb::before{content:'🧪'}
.salah{--c:#10b981}.salah .lb::before{content:'🕌'}.r.ov{border-style:dashed;opacity:.9}
.wk{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.wk div{flex:1;min-width:46px;text-align:center;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:6px 0;font-size:12px;cursor:pointer;backdrop-filter:blur(10px)}
.wk div b{display:block;font-size:16px}.wk div.sel{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(99,102,241,.35)}.wk div.sel span{color:#fff}
.cl.td{border-color:var(--ac)}

</style></head><body>
<div id="toast"></div>
<header><div><h1>LifeSync</h1><div class="mu" id="gr"></div></div><div class="row" style="flex:none"><button class="ol" id="th" onclick="theme()"></button><button class="ol" id="bell" onclick="alerts()"></button></div></header>
<main id="v"></main>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s);
const LS={g(k,d){try{const v=localStorage.getItem('ls_'+k);if(v==null)return d;const p=JSON.parse(v);return p==null?d:p}catch(e){return d}},s(k,v){try{localStorage.setItem('ls_'+k,JSON.stringify(v))}catch(e){}}};
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const pd=d=>new Date(d+'T00:00:00');
const addD=(d,n)=>{const x=pd(d);x.setDate(x.getDate()+n);return iso(x)};
const T=n=>{n=((n%1440)+1440)%1440;const h=Math.floor(n/60);return (h%12||12)+':'+String(n%60).padStart(2,'0')+(h>=12?' PM':' AM')};
const D=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m';
const WD=['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
const dl=d=>{const x=pd(d);return WD[x.getDay()]+', '+x.getDate()+'/'+(x.getMonth()+1)+'/'+x.getFullYear()};
const SH={M:[450,960],G:[540,1080],E1:[690,1200],E2:[900,1380],N:[1320,1890]};
const OFF=['W','H','ExL'],CK=['class','meal','gym','study','care','plan','eng','hs','ostudy','thesis','salah'];
const CODES='N N N W W E2 G N N N W W E2 G N N N W W E2 E2 N N N W W E2 G N N'.split(' ');
const CL={0:[['CSE 403',795,885]],1:[['MGT 401',675,765],['CSE 443',795,885],['CSE 403',885,975]],2:[['MGT 401',885,975],['CSE 449',975,1065]],3:[['CSE 443',585,675],['CSE 449',675,765]],4:[['CSE 450',675,765],['CSE 450',795,885]]};
const GY=[{n:'Chest + Triceps',ex:[['Bench Press','4×8'],['Incline DB Press','3×10'],['Chest Fly','3×12'],['Dips','3×10'],['Triceps Pushdown','3×12'],['Overhead Triceps Extension','3×12']]},{n:'Back + Biceps',ex:[['Deadlift / Rack Pull','3×5'],['Lat Pulldown','4×10'],['Barbell / Cable Row','3×10'],['Face Pull','3×15'],['Barbell Curl','3×10'],['Hammer Curl','3×12']]},{n:'Legs',ex:[['Squat','4×8'],['Romanian Deadlift','3×10'],['Leg Press','3×12'],['Leg Extension','3×12'],['Leg Curl','3×12'],['Calf Raise','4×15']]},{n:'Shoulders + Abs',ex:[['Overhead Press','4×8'],['Lateral Raise','4×15'],['Rear Delt Fly','3×15'],['Shrugs','3×12'],['Hanging Leg Raise','3×12'],['Plank','3×45s']]}];
const OSL=['IELTS Reading','Research paper পড়া','IELTS Listening','Book: ML / Data Science','SOP + scholarship খোঁজা','IELTS Writing','Book: textbook পড়া'];
let CFG=Object.assign({ow:210,ss:240,se:405,po:0},LS.g('cfg',{})||{});
const ENGL=['Vocabulary ২০ শব্দ','Speaking — shadowing','Reading + নতুন শব্দ','Writing — journal','Grammar + quiz','Listening (podcast)','Speaking — নিজের সাথে কথা'];
const csub=d=>[...new Set([...(CL[pd(d).getDay()]||[]),...(CL[pd(addD(d,1)).getDay()]||[])].map(x=>x[0]))];
const OT=(d,i)=>{const w=pd(d).getDay(),c=csub(d);return['English · '+ENGL[w],OSL[w],'CGPA · '+(c[0]||'ক্লাস')+' revision','Thesis paper পড়া / notes','Book: ML / Data Science','CGPA · '+(c[1]||c[0]||'ক্লাস')+' practice'][i%6]};
const osB=(d,a,L)=>{const o=[];for(let t=0,i=0;t<L;t+=60,i++)o.push({s:a+t,e:a+Math.min(L,t+60),t:'ostudy',f:i===0,l:'অফিসে পড়া · '+OT(d,i)});return o};
const Q=[['ভাত ১ কাপ',200,4],['ডিম ১টা',78,6],['মুরগি ১০০g',165,25],['ডাল ১ বাটি',120,8],['মাছ ১০০g',140,20],['কলা ১টা',105,1]];
document.documentElement.dataset.theme=LS.g('theme','dark');
let R=LS.g('roster',null);if(!R||typeof R!=='object'){R={};CODES.forEach((c,i)=>R['2026-11-'+String(i+1).padStart(2,'0')]=c)}
let done=LS.g('done',{})||{},skip=LS.g('skip',{})||{},tab='t',cur=iso(new Date());
if(!R[cur])cur='2026-11-01';
const TM={run:false,left:3000,end:0,sub:''};

function core(d){
 const c=R[d]||'',p=R[addD(d,-1)]||'',B=[];
 if(p==='N')B.push(...(()=>{const ss=Math.min(CFG.ss,420),se=Math.min(Math.max(CFG.se,ss+30),435),L=Math.min(CFG.ow,ss),a=ss-L;return[...(a>0?[{s:0,e:a,t:'shift',l:'Night shift চলছে'}]:[]),...osB(d,a,L),{s:ss,e:se,t:'sleep',l:'অফিসে ঘুম (ডিউটি)'},{s:se,e:450,t:'shift',l:'Night shift শেষ (7:30 AM)'}]})(),{s:450,e:495,t:'commute',l:'বাসায় ফেরা (45m)'});
 if(SH[c]){const[s,e]=SH[c];B.push({s:s-45,e:s,t:'commute',l:'অফিসে যাওয়া (45m)'},...(c==='N'?[{s,e:1440,t:'shift',l:c+' shift · '+T(s)+'–'+T(e)}]:[{s,e:s+90,t:'shift',l:c+' shift · '+T(s)+'–'+T(e)},...osB(d,s+90,CFG.ow),{s:s+90+CFG.ow,e,t:'shift',l:'শিফট চলছে'}]));if(e<1440)B.push({s:e,e:Math.min(e+45,1440),t:'commute',l:'বাসায় ফেরা (45m)'})}
 const bz=B.slice();let pe=-99;
 (CL[pd(d).getDay()]||[]).forEach(([n,s,e])=>{
  const id=d+'|'+n+s;
  if(bz.some(b=>b.s<e&&s-10<b.e)){B.push({s,e,t:'class',l:n+' ক্লাস — shift এর সাথে clash',x:1,id});return}
  if(skip[id]){B.push({s,e,t:'class',l:n+' (বাদ দেওয়া)',x:2,id});return}
  if(pe<s-10)B.push({s:s-10,e:s,t:'travel',l:n+' ক্লাসে যাওয়া (10m আগে)'});
  B.push({s,e,t:'class',l:n+' ক্লাস',id});pe=e});
 return B}
function wake(d){
 if((R[addD(d,-1)]||'')==='N')return null;
 const f=Math.min(1440,...core(d).filter(b=>!b.x).map(b=>b.s));
 return Math.max(330,Math.min(480,f-45))}
function bed(d){
 if((R[d]||'')==='N')return null;
 const w=wake(addD(d,1));return w==null?null:1440-Math.max(0,480-w)}
function trg(){const p=LS.g('prof',{w:65,h:170,a:22,g:0});const k=Math.round((10*p.w+6.25*p.h-5*p.a+5)*1.45+(+p.g));return{k,p:Math.round(p.w*1.8),f:Math.round(k*.25/9)}}
function subs(d){const f=x=>core(x).filter(b=>b.t==='class'&&!b.x).map(b=>b.l.replace(' ক্লাস','')),u=[...new Set(f(d).concat(f(addD(d,1))))];if(u.length<2)u.push('Thesis (Bangla OCR)','Coding practice');return u}
const isG=k=>{const c=R[k]||'',p=R[addD(k,-1)]||'';return OFF.includes(c)||(c==='E2'&&OFF.includes(p))||(c==='N'&&p!=='N')};
function gi(d){return Object.keys(R).filter(k=>k<d&&isG(k)).length%4}
function plan(d){
 const c=R[d]||'',pN=(R[addD(d,-1)]||'')==='N',B=core(d),F=B.filter(b=>!b.x),w=wake(d),bd=bed(d),rg=[];
 if(pN)rg.push([525,840]);else rg.push([0,w]);
 if(c==='N')rg.push([900,1050]);
 if(bd!=null)rg.push([bd,1440]);
 const OV=[],PT=pt(d),SA=[['ফজর',PT.f,20,PT.s-10],pd(d).getDay()===5?['জুমা',PT.d+75,60,PT.a-20]:['যোহর',PT.d,15,PT.a-10],['আসর',PT.a,15,PT.m-10],['মাগরিব',PT.m,15,PT.i-10],['ইশা',PT.i,20,1410]];
 SA.forEach(([n,t0,len,we])=>{let s=t0,ok=0;for(;s<=we-len;s+=5)if(!F.some(b=>b.s<s+len&&s<b.e)){ok=1;break}
  if(ok)F.push({s,e:s+len,t:'salah',l:n+' নামাজ'+(s>t0+15?' (দেরিতে)':'')});else OV.push({s:t0,e:t0+len,t:'salah',ov:1,l:n+' নামাজ (ডিউটি/ক্লাসের সময়ে)'})});
 const S=[],Fs=[...F].sort((a,b)=>a.s-b.s);
 rg.forEach(([a,b])=>{let t=a;Fs.forEach(f=>{if(f.e<=t||f.s>=b)return;if(f.s-t>=45)S.push({s:t,e:f.s});t=Math.max(t,f.e)});if(b-t>=45)S.push({s:t,e:b})});
 const all=F.concat(S.map(x=>({...x,t:'sleep',l:'ঘুম'})));
 const free=(s,e)=>!all.some(b=>b.s<e&&s<b.e);
 const put=(len,tg,t,l)=>{for(let k=0;k<=160;k+=15)for(const sg of[1,-1]){const s=tg+sg*k;if(s>=300&&s+len<=1440&&free(s,s+len)){const b={s,e:s+len,t,l};all.push(b);return b}}};
 const ws=(S.filter(x=>x.s<1000)[0]||{e:w||480}).e,tr=trg();
 put(30,ws,'care','উঠে ফ্রেশ + মর্নিং স্কিনকেয়ার (cleanser → moisturizer → sunscreen)');
 let lm=null;
 [[pN?'Brunch':'Breakfast',ws+40,.3],['Lunch',810,.35],['Dinner',1230,.35]].forEach(([n,tg,f])=>{
  const b=put(30,tg,'meal',n+' · ~'+Math.round(tr.k*f)+' kcal · protein '+Math.round(tr.p*f)+'g');
  if(b){if(lm!=null&&b.s-lm<150)all.pop();else lm=b.s}});
 if(isG(d))put(90,1020,'gym','Gym — '+GY[gi(d)].n)||put(90,600,'gym','Gym — '+GY[gi(d)].n)||put(90,1200,'gym','Gym — '+GY[gi(d)].n);
 if(bd!=null)put(30,bd-45,'plan','রাতের স্কিনকেয়ার + কালকের to-do plan');
 const sb=subs(d);let si=0;
 const gaps=()=>{const a=[...all].sort((x,y)=>x.s-y.s),o=[];let t=360;a.forEach(b=>{if(b.s>t)o.push([t,b.s]);t=Math.max(t,b.e)});if(t<1440)o.push([t,1440]);return o};

 +L.map(r=>`<div class="r rem"><div class="tm">${T(r.s)}<small>${r.d==='*'?'প্রতিদিন':r.d.slice(5)}</small></div><div class="lb">${r.n}${r.l?'<br><span class="mu">'+r.l+' মিনিট আগে জানাবে</span>':''}</div><button class="sm" data-id="${r.id}" onclick="dR(this.dataset.id)">✕</button></div>`).join('')
 +`<div class="row"><button class="ol" onclick="alertUser('⏰ টেস্ট alert')">Test alert</button></div><p class="mu">reminder Today টাইমলাইনেও 🔔 হয়ে দেখা যাবে। alert বাজবে পেজ খোলা থাকলে।</p>${hlth()}${setg()}<div class="cd"><b>💾 Backup / Restore</b><textarea id="bk" placeholder="Export চাপলে data এখানে আসবে; Restore এর জন্য paste করো"></textarea><div class="row"><button onclick="bkx()">Export</button><button class="ol" onclick="bki()">Import</button></div></div>`}
function addR(){const n=$('#rn').value.trim(),t=$('#rt').value;if(!n||!t)return;const L=LS.g('rem',[]);L.push({id:Date.now(),n,s:Number(t.slice(0,2))*60+Number(t.slice(3,5)),l:+$('#rl').value,d:$('#rr').value});LS.s('rem',L);render()}
function dR(id){LS.s('rem',LS.g('rem',[]).filter(r=>String(r.id)!==id));render()}
function strip(){let h='<div class="wk">';for(let i=-3;i<=3;i++){const k=addD(cur,i),c=R[k]||'';h+=`<div class="${k===cur?'sel':''}" data-k="${k}" onclick="cur=this.dataset.k;render()">${WD[pd(k).getDay()]}<b>${pd(k).getDate()}</b><span class="c${c}">${c||'·'}</span></div>`}return h+'</div>'}
function mstat(y,m,n){const c={};for(let d=1;d<=n;d++){const k=R[iso(new Date(y,m,d))];if(k)c[k]=(c[k]||0)+1}const w=(c.M||0)+(c.G||0)+(c.E1||0)+(c.E2||0)+(c.N||0),o=(c.W||0)+(c.H||0);return `<div class="cd"><b>এই মাসের হিসাব</b><div class="ch">${Object.keys(c).map(k=>`<span class="c${k}">${k}: ${c[k]}</span>`).join('')}</div><span class="mu">কাজের দিন ${w} · off day ${o} · gym সেশন ${Array.from({length:n},(_,i)=>iso(new Date(y,m,i+1))).filter(k=>R[k]&&isG(k)).length}</span></div>`}
function fbars(){const F=LS.g('focus',{}),a=[];let mx=60;for(let i=6;i>=0;i--){const k=addD(iso(new Date()),-i),v=F[k]||0;a.push([k,v]);mx=Math.max(mx,v)}return `<div class="cd"><b>গত ৭ দিনের focus</b><div class="bars">${a.map(([k,v])=>`<div><i style="height:${Math.round(v/mx*64)}px"></i>${WD[pd(k).getDay()]}<br>${v}m</div>`).join('')}</div></div>`}
function wlog(){const L=LS.g('wt',[]),l=L.slice(-5).reverse(),d=L.length>1?(L[L.length-1].w-L[0].w).toFixed(1):0;return `<div class="cd"><b>⚖️ ওজন log</b>${L.length>1?` <span class="mu">(শুরু থেকে ${d>0?'+':''}${d} kg)</span>`:''}<div class="row"><input id="wv" type="number" step="0.1" placeholder="আজকের ওজন kg"><button onclick="addWt()">Save</button></div>${l.map(x=>`<div class="mu">${x.d.slice(5)} · ${x.w} kg</div>`).join('')}</div>`}
function addWt(){const w=parseFloat($('#wv').value);if(!w)return;const L=LS.g('wt',[]);L.push({d:iso(new Date()),w});LS.s('wt',L);const p=LS.g('prof',{w:65,h:170,a:22,g:0});p.w=w;LS.s('prof',p);render()}
function bkx(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('ls_'))o[k]=localStorage.getItem(k)}}catch(e){}const s=JSON.stringify(o);$('#bk').value=s;try{navigator.clipboard.writeText(s);toast('কপি হয়েছে ✓')}catch(e){}}
function bki(){try{const o=JSON.parse($('#bk').value);Object.keys(o).forEach(k=>{if(k.startsWith('ls_'))localStorage.setItem(k,o[k])});toast('Restore ✓');setTimeout(()=>location.reload(),800)}catch(e){toast('Data ঠিক নেই')}}
const CAT={work:['💼','#6366f1',['shift','commute']],learn:['📚','#0ea5e9',['study','ostudy','thesis','eng','hs','class','travel']],sleep:['😴','#64748b',['sleep']],body:['🏋️','#ef4444',['gym','care']],other:['🍽️','#22c55e',['meal','plan','rem','salah']]};
const hm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function dbar(P){const t={};P.forEach(b=>{if(b.t==='free'||b.ov)return;const k=Object.keys(CAT).find(k=>CAT[k][2].includes(b.t))||'other';t[k]=(t[k]||0)+Math.min(b.e,1440)-Math.max(b.s,0)});const s=Object.values(t).reduce((a,b)=>a+b,0)||1;return `<div class="bar" style="display:flex;height:12px">${Object.keys(t).map(k=>`<i style="width:${t[k]/s*100}%;background:${CAT[k][1]}"></i>`).join('')}</div><div class="mu" style="margin-bottom:8px">${Object.keys(t).map(k=>CAT[k][0]+' '+D(t[k])).join(' · ')}</div>`}
function nextAl(){const n=new Date(),m=n.getHours()*60+n.getMinutes(),d=iso(n),c=[];plan(d).forEach(b=>{if(!b.x&&!['free','shift'].includes(b.t)&&!(b.t==='ostudy'&&!b.f)&&b.s-5>m)c.push([b.s-5,b.l])});LS.g('rem',[]).forEach(r=>{if((r.d==='*'||r.d===d)&&r.s-r.l>m)c.push([r.s-r.l,'⏰ '+r.n])});c.sort((a,b)=>a[0]-b[0]);return c[0]}
function hlth(){const on=LS.g('alerts',false),np='Notification' in window?Notification.permission:'unsupported',na=nextAl();return `<div class="cd"><b>🩺 Alert health check</b><div class="mu">অ্যালার্ট: ${on?'চালু ✓':'বন্ধ ✗ (উপরে 🔕 চাপো)'}<br>Browser notification: ${np==='granted'?'অনুমতি আছে ✓':np==='denied'?'ব্লক ✗ (browser settings থেকে allow করো)':np==='default'?'অনুমতি চাওয়া হয়নি':'এই browser এ নেই'}${SW?' · Service worker ✓':' · Service worker নেই (Android এ sw.js লাগবে)'}<br>পরের alert: ${na?T(na[0])+' — '+na[1]:'আজ আর নেই'}</div><div class="row"><button onclick="alertUser('🔔 টেস্ট alert')">এখনই Test</button><button class="ol" onclick="toast('১০ সেকেন্ড পর বাজবে — screen lock করো');setTimeout(()=>alertUser('🔔 ১০s টেস্ট'),10000)">১০s পরে Test</button></div></div>`}
function setg(){return `<div class="cd"><b>⚙️ Duty settings</b><div class="mu">অফিসে পড়ার সময়</div><div class="row"><select id="cw">${[180,210,240].map(v=>`<option value="${v}"${CFG.ow===v?' selected':''}>${v/60} ঘণ্টা</option>`).join('')}</select></div><div class="mu">নামাজের সময় সমন্বয় (মিনিট, + / −)</div><div class="row"><input id="po" type="number" value="${CFG.po||0}"></div><div class="mu">নাইট duty তে ঘুমের সময় (শুরু → শেষ)</div><div class="row"><input id="cs" type="time" value="${hm(CFG.ss)}"><input id="ce" type="time" value="${hm(CFG.se)}"><button onclick="svc()">Save</button></div></div>`}
function svc(){const f=v=>Number(v.slice(0,2))*60+Number(v.slice(3,5));CFG={po:+$('#po').value||0,ow:+$('#cw').value,ss:f($('#cs').value||'04:00'),se:f($('#ce').value||'06:45')};LS.s('cfg',CFG);render();toast('Save হয়েছে ✓')}
const rd=Math.PI/180,sn=x=>Math.sin(x*rd),cs=x=>Math.cos(x*rd);
function pt(d){
 const x=pd(d),j=Date.UTC(x.getFullYear(),x.getMonth(),x.getDate(),12)/864e5+2440587.5-2451545,
 g=(357.529+.98560028*j)%360,q=(280.459+.98564736*j)%360,L=(q+1.915*sn(g)+.02*sn(2*g))%360,e=23.439-3.6e-7*j,
 ra=((Math.atan2(cs(e)*sn(L),cs(L))/rd)/15+24)%24,eq=((q/15-ra+12)%24+24)%24-12,dc=Math.asin(sn(e)*sn(L))/rd,
 la=23.8103,mid=12+6-90.4125/15-eq,
 H=a=>Math.acos((sn(a)-sn(dc)*sn(la))/(cs(dc)*cs(la)))/rd/15,
 ar=Math.atan(1/(1+Math.tan(Math.abs(la-dc)*rd)))/rd,m=h=>Math.round(h*60)+(CFG.po||0);
 return{f:m(mid-H(-18)),s:m(mid-H(-.833)),d:m(mid+.017),a:m(mid+H(ar)),m:m(mid+H(-.833)),i:m(mid+H(-18))}}
function prow(){const p=pt(cur);return `<div class="mu" style="margin-bottom:8px">🕌 ফজর ${T(p.f)} · যোহর ${T(p.d)} · আসর ${T(p.a)} · মাগরিব ${T(p.m)} · ইশা ${T(p.i)}</div>`}
function theme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;LS.s('theme',t);render()}
render();setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});document.addEventListener('click',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});try{if('serviceWorker' in navigator&&(location.protocol==='http:'||location.protocol==='https:'))navigator.serviceWorker.register('sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(r=>{SW=r}).catch(()=>{})}catch(e){}setInterval(tt,1000);setInterval(()=>{if(tab==='t')render()},60000);
